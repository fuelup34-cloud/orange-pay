<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Strawberry Pay — the faster, safer way to pay and get paid." />
    <title>Why Strawberry Pay</title>
    <script>
      // Apply the saved theme (or the device's setting) before the page draws, to avoid a white flash.
      (function () {
        var theme;
        try { theme = localStorage.getItem('strawberry-pay-theme') || localStorage.getItem('mango-pay-theme') || localStorage.getItem('orange-pay-theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
